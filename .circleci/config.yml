version: 2.1

jobs:
  build-job:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Install Dependencies
          command: echo "Installing dependencies..."
      - run:
          name: Build Project
          command: echo "Building project files..."

  test-job:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Run Tests
          command: echo "Running tests... All tests passed!"

workflows:
  build-test-workflow:
    jobs:
      - build-job
      - test-job:
          requires:
            - build-job
