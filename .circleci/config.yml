version: 2.1

jobs:
  hello-job:            # A job is a single unit of work
    docker:
      - image: cimg/base:stable   # CircleCI base Linux image
    steps:
      - checkout                 # Step 1: Pulls code from GitHub
      - run:
          name: Say Hello        # Step 2: Simple echo command
          command: echo "Hello CircleCI! Your pipeline is working."

workflows:
  hello-workflow:        # Workflow = order of jobs
    jobs:
      - hello-job
