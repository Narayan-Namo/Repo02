version: 2.1

jobs:
  build-job:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Build Project
          command: echo "Building project files..."

  test-job-1:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Run Unit Tests
          command: echo "Running unit tests... ✅"

  test-job-2:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Run Integration Tests
          command: echo "Running integration tests... ✅"

workflows:
  build-and-parallel-tests:
    jobs:
      - build-job
      - test-job-1:
          requires:
            - build-job
      - test-job-2:
          requires:
            - build-job
